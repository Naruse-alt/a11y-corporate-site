# PR と main への push で型・ビルド・コントラストを自動検証する。
# デプロイやシークレット依存のステップは含めない（面接用ポートフォリオの品質ゲートのみ）。
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 同じ PR / ブランチの古い実行は打ち切り、最新だけ残す
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .nvmrc（22）に合わせ、engines.node >=22 とローカル環境を揃える
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # lockfile 通りに依存関係を入れ、再現性のある CI にする
      - name: Install dependencies
        run: npm ci

      # Astro / TypeScript の静的診断（astro check）
      - name: Type check
        run: npm run check

      # 静的サイトが実際にビルドできることを確認する
      - name: Build
        run: npm run build

      # tokens.css の色ペアが WCAG AA を満たすか機械判定する（推測禁止ルールの根拠）
      # 根拠: docs/decisions.md「コントラスト検証ツール scripts/contrast.mjs」
      - name: Contrast check
        run: npm run contrast
